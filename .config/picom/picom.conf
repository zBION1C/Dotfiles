#################################
#
# Opacity
#
#################################
backend = "glx";


# Enable global animations
animations = (
    {
        triggers = ["open", "show"];
        preset = "appear";
        duration = 0.16;    # Duration in seconds
        scale = 0.95;       # Scale factor to start the window expansion
    },
    {
        triggers = ["close", "hide"];
        preset = "disappear";
        duration = 0.16;    # Duration in seconds
        scale = 0.95;       # Scale factor to shrink the window
    },
    {
        triggers = ["geometry"];
        preset = "geometry-change";
        duration = 0.2;
    }
)

